name: Build and Publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: >-
          Rebase the custom stack onto an upstream release before building.
          Leave EMPTY to just (re)build the current master.
          Use "latest" to auto-pick the newest upstream release tag,
          or give an exact tag e.g. "xmage_1.4.60V1".
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One-click release: rebase the custom commit stack onto a new upstream
      # release tag, then build/publish the result in this same run. Skipped on
      # plain pushes and on input-less manual runs (which just rebuild master).
      # On a cherry-pick conflict the job fails (you get the failure email) —
      # do that release by hand per RELEASING.md.
      - name: Rebase custom stack onto upstream release
        if: github.event_name == 'workflow_dispatch' && inputs.upstream_tag != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/magefree/mage.git 2>/dev/null || true
          git fetch --tags --quiet upstream

          INPUT="${{ inputs.upstream_tag }}"
          if [ "$INPUT" = "latest" ]; then
            TAG=$(git tag -l 'xmage_*' | sort -V | tail -1)
            echo "Auto-selected newest upstream tag: $TAG"
          else
            TAG="$INPUT"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Upstream tag '$TAG' not found"; exit 1
          fi

          OLD_MASTER=$(git rev-parse HEAD)
          PREV=$(git describe --tags --match 'xmage_*' --abbrev=0 HEAD)
          echo "Current base: $PREV   Target: $TAG"
          if [ "$PREV" = "$TAG" ]; then
            echo "::error::master is already based on $TAG — nothing to do"; exit 1
          fi
          echo "Custom commits to carry over: $(git rev-list --count "$PREV..$OLD_MASTER")"

          # Rebuild the base = upstream tag + custom stack, in order.
          git checkout -B master "refs/tags/$TAG"
          if ! git cherry-pick "$PREV..$OLD_MASTER"; then
            git cherry-pick --abort || true
            echo "::error::Cherry-pick conflict rebasing the custom stack onto $TAG. Do this release by hand (see RELEASING.md)."
            exit 1
          fi

          # Publish the new base. The upstream tag MUST be on origin so the
          # version-detection step below resolves correctly. The force-push to
          # master does not re-trigger this workflow (GITHUB_TOKEN pushes don't),
          # so the current run continues and builds the rebased tree.
          git push origin "refs/tags/$TAG"
          git push --force origin master
          echo "Rebased master onto $TAG and pushed. Continuing to build & publish."

      - name: Determine xmage version
        id: version
        run: |
          XMAGE_VERSION=$(git describe --tags --match 'xmage_*' --abbrev=0 HEAD 2>/dev/null || echo "")
          BUILD_DATE=$(date -u +%Y-%m-%d_%H-%M)
          # Extract version number from tag (e.g. xmage_1.4.58V1 -> 1.4.58)
          VERSION_NUMBER=$(echo "$XMAGE_VERSION" | sed 's/xmage_//' | sed 's/V[0-9]*//')
          echo "xmage_version=$XMAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "Detected xmage version: $XMAGE_VERSION ($VERSION_NUMBER)"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Build with Maven
        run: mvn clean install -U -DskipTests -B

      - name: Assemble server
        working-directory: Mage.Server
        run: |
          mvn assembly:single -B
          mkdir -p /tmp/release/mage-server
          unzip target/mage-server.zip -d /tmp/release/mage-server
          cp target/mage-server.jar /tmp/release/mage-server/lib/

      - name: Assemble client
        working-directory: Mage.Client
        run: |
          mvn assembly:single -B
          mkdir -p /tmp/release/mage-client
          unzip target/mage-client.zip -d /tmp/release/mage-client
          cp target/mage-client.jar /tmp/release/mage-client/lib/

      - name: Create release zip
        id: release_zip
        run: |
          VERSION="${{ steps.version.outputs.xmage_version }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          FILENAME="mage-full_${VERSION}_${BUILD_DATE}.zip"
          cd /tmp/release
          zip -r "/tmp/${FILENAME}" mage-server/ mage-client/
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "filepath=/tmp/${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Created release zip: $FILENAME ($(du -h /tmp/${FILENAME} | cut -f1))"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.xmage_version }}"
          TAG="release-${VERSION}"
          FILENAME="${{ steps.release_zip.outputs.filename }}"
          FILEPATH="${{ steps.release_zip.outputs.filepath }}"

          # Delete existing release for this version if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Build release notes from CHANGES.md
          CHANGES=$(cat CHANGES.md)

          # Create new release
          gh release create "$TAG" "$FILEPATH" \
            --title "XMage Custom Build — $VERSION" \
            --notes "$(cat <<EOF
          Custom XMage build based on upstream \`$VERSION\` with additional fixes.

          Contains both client and server.

          ## Usage
          Use [xmage-launcher-qt](https://github.com/t-my/xmage-launcher-qt) to download and run this build.

          ## Docker
          \`\`\`
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION
          \`\`\`

          ${CHANGES}
          EOF
          )"

      - name: Get release download URL
        id: release_url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.xmage_version }}"
          TAG="release-${VERSION}"
          FILENAME="${{ steps.release_zip.outputs.filename }}"
          DOWNLOAD_URL=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$FILENAME\") | .url")
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "Release download URL: $DOWNLOAD_URL"

      - name: Generate config.json for GitHub Pages
        run: |
          VERSION="${{ steps.version.outputs.version_number }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          DOWNLOAD_URL="${{ steps.release_url.outputs.download_url }}"

          mkdir -p /tmp/pages
          cat > /tmp/pages/config.json << EOF
          {
            "java": {
              "version": "1.8.0_201",
              "location": "https://xmage.today/java/jre-8u201-"
            },
            "XMage": {
              "version": "${VERSION}-dev (${BUILD_DATE//_/ })",
              "location": "${DOWNLOAD_URL}",
              "locations": [],
              "full": "${DOWNLOAD_URL}",
              "torrent": "",
              "images": "",
              "Launcher": {
                "version": "0.3.8",
                "location": "https://beta.xmage.today/files/XMageLauncher-0.3.8.jar"
              }
            }
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Docker image
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.xmage_version }},enable=${{ steps.version.outputs.xmage_version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
